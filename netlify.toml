# netlify.toml — FINAL

[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

  # Build env (kept here so it travels with the repo)
  [build.environment]
    NODE_VERSION = "20.19.0"

    # Secret scan: these values are PUBLIC by design (Vite exposes VITE_* at build),
    # so tell Netlify it's OK if these appear in the bundle.
    SECRETS_SCAN_OMIT_KEYS = "VITE_PAYPAL_CLIENT_ID,VITE_STRIPE_PUBLIC_KEY"

# Single API proxy. Remove ALL other /api, /stripe, /paypal rules.
[[redirects]]
  from = "/api/*"
  to   = "https://api.echoscript.ai/api/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Sensible caching & security headers
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
