# netlify.toml (frontend)
[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

# Strong cache for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# No-store for the HTML shell
[[headers]]
  for = "/index.html"
  [headers.values]
  Cache-Control = "no-store, must-revalidate"

# Security headers (lightweight)
[[headers]]
  for = "/*"
  [headers.values]
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Content-Type-Options = "nosniff"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

