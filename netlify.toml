[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--silent"
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/api/v1/*"
  to   = "https://YOUR-TUNNEL.trycloudflare.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to   = "https://YOUR-TUNNEL.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

