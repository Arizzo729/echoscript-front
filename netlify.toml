[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_FLAGS = "--include=dev --no-audit --no-fund"

# Proxy API calls from the live site to your local backend via the tunnel
[[redirects]]
  from = "/api/v1/*"
  to   = "https://chem-jews-pledge-counseling.trycloudflare.com/api/v1/:splat"
  status = 200
  force  = true

# ✅ SPA fallback AFTER the proxy
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# (optional) never cache service workers
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"
