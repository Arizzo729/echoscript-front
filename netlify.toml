# netlify.toml (put this at the root of the *frontend* repo)

[build]
command = "npm ci --no-audit --no-fund && npm run build"
publish = "dist"

[build.environment]
# Force Node 20 so Vite/React Router 7 are happy
NODE_VERSION = "20.19.0"

# Ensure devDependencies (vite, plugin-react) are installed even if NODE_ENV=production gets set somewhere
NPM_FLAGS = "--include=dev --no-audit --no-fund"

# (Optional) keep your headers/redirects below if you use them
