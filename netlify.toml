# netlify.toml (root)

[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--silent"
  SECRETS_SCAN_ENABLED = "false"

# SPA routing
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
