# netlify.toml (complete)
[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://api.echoscript.ai/api/:splat"  # <-- keep /api here
  status = 200
  force = true
  headers = { Host = "api.echoscript.ai" }

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Helpful headers
[[headers]]
  for = "/index.html"
  [headers.values]
  Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Content-Type-Options = "nosniff"
