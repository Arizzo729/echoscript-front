[build]
command = "npm ci --no-audit --no-fund && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20.19.0"
NPM_FLAGS = "--include=dev --no-audit --no-fund"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
