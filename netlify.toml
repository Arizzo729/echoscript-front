[build]
command = "npm ci --no-audit --no-fund && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20.19.0"
NPM_FLAGS = "--include=dev --no-audit --no-fund"

# ✅ SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ✅ Proxy frontend /api/* calls to your backend (no CORS headaches)
[[redirects]]
  from = "/api/*"
  to = "https://<YOUR-BACKEND-URL>/api/:splat"
  status = 200
  force = true

# (optional) never cache service worker files if they ever appear
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"
