[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

# (Optional) you can keep Netlify UI env vars instead of setting them here.
[build.environment]
  # VITE_API_URL = "https://api.echoscript.ai"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Caching / security headers you already had
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# ---- Backend proxies (NEW for PayPal & Stripe; API already existed) ----
[[redirects]]
  from = "/api/*"
  to = "https://api.echoscript.ai/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/paypal/*"
  to = "https://api.echoscript.ai/paypal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/stripe/*"
  to = "https://api.echoscript.ai/stripe/:splat"
  status = 200
  force = true

# Canonical redirect (keep)
[[redirects]]
  from = "/*"
  to = "https://www.echoscript.ai/:splat"
  status = 301
  force = true
  conditions = { Host = ["echoscript.ai"] }

# SPA fallback (keep and LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

