[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

# Optional: if secret scanning keeps blocking deploys
[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL,VITE_PAYPAL_CLIENT_ID,STRIPE_MODE,PAYPAL_ENV,WHISPER_MODEL_SIZE,API_HOST,API_PORT,ENV,ACCESS_TOKEN_EXPIRE_MINUTES"
  SECRETS_SCAN_OMIT_PATHS = "public/**,dist/**"

########################################
# 1) API proxy — MUST be first
########################################
[[redirects]]
  from = "/api/*"
  to   = "https://api.echoscript.ai/api/:splat"
  status = 200
  force = true

########################################
# 2) Canonical host: apex -> www (second)
########################################
[[redirects]]
  from = "/*"
  to   = "https://www.echoscript.ai/:splat"
  status = 301
  force = true
  conditions = { Host = ["echoscript.ai"] }

########################################
# 3) SPA fallback (last)
########################################
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

########################################
# 4) Caching & security headers
########################################
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
