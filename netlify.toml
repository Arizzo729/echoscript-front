# netlify.toml  (Frontend)

[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Optional: if secret scanning keeps false-flagging Vite envs
  SECRETS_SCAN_ENABLED = "false"

########################################
# API proxy → your Railway API
########################################
[[redirects]]
  from = "/api/*"
  to = "https://api.echoscript.ai/:splat"
  status = 200
  force = true

########################################
# SPA fallback (React Router)
########################################
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

########################################
# Caching for built assets (optional)
########################################
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

########################################
# Security headers (optional)
########################################
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

