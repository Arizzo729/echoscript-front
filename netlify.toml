[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL,VITE_PAYPAL_CLIENT_ID,STRIPE_MODE,PAYPAL_ENV,WHISPER_MODEL_SIZE,API_HOST,API_PORT,ENV,ACCESS_TOKEN_EXPIRE_MINUTES"
  SECRETS_SCAN_OMIT_PATHS = "public/**,dist/**"

# Proxy ALL /api/* calls to your backend, **preserving /api/**
[[redirects]]
  from = "/api/*"
  to = "https://api.echoscript.ai/api/:splat"
  status = 200
  force = true
  # optional but helpful for logging/origin awareness on backend
  headers = { X-Forwarded-Host = "echoscript.ai" }

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caching (optional, safe defaults)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

