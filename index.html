<!DOCTYPE html>
<html lang="en" class="light scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoScript.AI – The Best Listener</title>

    <meta name="description" content="EchoScript.AI: Upload, transcribe, and manage audio with AI precision." />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="color-scheme" content="light dark" />

    <!-- Kill any stale service workers & caches that can blank-screen the app -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations?.().then(r => r.forEach(sw => sw.unregister()));
      }
      if (window.caches?.keys) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
      }
    </script>

    <!-- We intentionally omit <link rel="manifest"> to stop install prompts -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  <body class="bg-white text-zinc-900 dark:bg-zinc-900 dark:text-zinc-100 font-sans antialiased">
    <div id="root"></div>
    <!-- Vite entry (correct path) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
